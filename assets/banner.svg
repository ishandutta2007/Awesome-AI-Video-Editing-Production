<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00dfd8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="800" height="200" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Animated ambient glowing orbs in background -->
  <circle cx="120" cy="60" r="80" fill="#7928ca" opacity="0.25" filter="url(#glow)">
    <animate attributeName="cx" values="120;200;120" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.18;0.32;0.18" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="680" cy="140" r="90" fill="#00dfd8" opacity="0.20" filter="url(#glow)">
    <animate attributeName="cx" values="680;600;680" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.28;0.15" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Title and Subtitle - strictly clear and unobstructed -->
  <g text-anchor="middle">
    <text x="400" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#accent)" letter-spacing="1">
      🎬 AI Video Editing &amp; Production
    </text>
    <text x="400" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" letter-spacing="0.5">
      Curated Ecosystem of SaaS Platforms, Agentic Editors &amp; Open-Source Tools
    </text>
    <text x="400" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e">
      Timeline Agents • Text-Based Cutting • Multimodal Production • Local-First Pipelines
    </text>
  </g>
</svg>
